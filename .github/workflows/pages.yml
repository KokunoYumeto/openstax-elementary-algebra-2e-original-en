name: Publish verified reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize the exact validated release reader
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output reader.zip \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.1/openstax-elementary-algebra-2e-original-en-html-v1.0.1.zip"
          echo "e2b5569cf664a970e24d8903235689a5676766d0d9b406a439dff860770875b8  reader.zip" | sha256sum --check --strict
          mkdir site
          python -m zipfile -e reader.zip site
          python scripts/check_program_navigation.py \
            --root site/openstax-elementary-algebra-2e-original-en-html \
            --no-write
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/openstax-elementary-algebra-2e-original-en-html
      - name: Deploy exact validated reader
        id: deployment
        uses: actions/deploy-pages@v4
